# Dedicated loopback-only test services, fixed by BoardPaginationTestDatabase.
# Does not import the developer's .env.
spring.mail.password=not-configured-test-only
kakao.client-id=not-configured-test-only
kakao.client-secret=not-configured-test-only
kakao.redirect-uri=http://localhost/auth/kakao/callback
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
logging.level.org.hibernate.stat=OFF
logging.level.root=WARN
debug=false
